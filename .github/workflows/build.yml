name: Build Xiaozhi ESP32 Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  IDF_CCACHE_ENABLE: 1
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore ESP-IDF Build Cache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            managed_components
            ~/.cache/idf-component-manager
          key: xiaozhi-esp32-v6.1-${{ runner.os }}-${{ hashFiles('sdkconfig*', '**/config.json', 'CMakeLists.txt') }}
          restore-keys: |
            xiaozhi-esp32-v6.1-${{ runner.os }}-

      - name: Build Firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py esp32-audio-kit
          ccache -s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/*.bin
            build/merged-binary.bin
